<html lang="vi">
<head>
  <meta charset="UTF-8" />

  <title>Trang Giáo Viên — Quản lý Học viên (IELTS Writing)</title>
  <link rel="icon" href="data:," />

  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700;800&family=Lexend:wght@400;500;600;700;800;900&display=swap"
    rel="stylesheet"
  />

<body>
  <div id="teacher-app"></div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./supabase-config.js?v=20261126m"></script>
  <script src="./supabase-client.js?v=20261126m"></script>
  <script src="./writing-data.js?v=20261126m"></script>
  <script>
    (function () {
      const CLOUD = window.ReadingCloud;
      const UNITS = window.WRITING_UNITS || [];
      const escapeHtml = CLOUD.escapeHtml;
      const RELEASE_MINUTES = 15;

      const unitById = {};
      UNITS.forEach(u => {
        unitById[u.id] = u;
      });

      const tState = {
        loading: false,
        authenticated: false,
        unauthorizedEmail: "",
        teacherEmail: "",
        teacherUserId: "",
        accountMenuOpen: false,
        infoModalStudentId: "",
        selectedStudentId: "", // "" = danh sách học viên | "<uuid>" = bài viết của học viên đó
        gradingSubId: "",
        releasingSubId: "",
        deletingSubId: "",
        flushingQueue: false,
        authError: "",
        dbError: "",
        students: [],
        submissions: [],
        searchQuery: "",
        filterLesson: "all",
        filterStatus: "all", // "all" | "waiting" | "unread_review" | "released" | "no_feedback" | "has_subs"
        savedToastId: ""
      };

      function isHiddenAdminAccount(email, rawName) {
        const lowerEmail = String(email || "").trim().toLowerCase();
        const lowerName = String(rawName || "").trim().toLowerCase();
        return (
          lowerEmail === "mtung0208@gmail.com" ||
          lowerEmail.startsWith("mtung0208@") ||
          lowerName === "mtung0208"
        );
      }

      function getTeacherDisplayName(email) {
        const lower = String(email || "").trim().toLowerCase();
        if (lower === "mtung0208@gmail.com" || lower.startsWith("mtung0208@")) {
          return "admin";
        }
        return email ? email.split("@")[0] : "Giáo viên";
      }

      function getInitials(name) {
        const clean = String(name || "").trim();
        if (!clean) return "GV";
        if (clean.toLowerCase() === "admin") return "AD";
        const parts = clean.split(/\s+/).filter(Boolean);
        if (parts.length === 1) return parts[0].slice(0, 2).toUpperCase();
        return (parts[0][0] + parts[parts.length - 1][0]).toUpperCase();
      }

      // ======================================================================
      // CLOUD DATA LOADER
      // ======================================================================
      async function verifyAndLoadCloudTeacher(user) {
        const client = CLOUD.getClient();
        if (!client || !user) return;

        tState.loading = true;
        tState.authError = "";
        tState.unauthorizedEmail = "";
        renderTeacherApp();

        const email = String(user.email || "").trim().toLowerCase();
        const { data: isTeacherFlag, error: rpcError } = await client.rpc("is_teacher");
        const allowed = Boolean(!rpcError && isTeacherFlag === true) || email === "mtung0208@gmail.com";
        if (!allowed) {
          tState.loading = false;
          tState.authenticated = false;
          tState.unauthorizedEmail = email;
          renderTeacherApp();
          return;
        }

        tState.authenticated = true;
        tState.teacherEmail = email;
        tState.teacherUserId = user.id || "";
        await refreshCloudDashboardData();
      }

      async function refreshCloudDashboardData() {
        const client = CLOUD.getClient();
        if (!client) return;

        tState.loading = true;
        tState.dbError = "";
        renderTeacherApp();

        const [profilesRes, subsRes, reviewsRes] = await Promise.all([
          client.from("profiles").select("id, email, full_name, created_at, last_active_at").order("last_active_at", { ascending: false }),
          client.from("writing_submissions").select("*").order("submitted_at", { ascending: false }),
          client.from("writing_ai_reviews").select("*")
        ]);

        const firstErr = profilesRes.error || subsRes.error;
        if (firstErr) {
          tState.dbError =
            "Không thể đọc dữ liệu từ Supabase (" +
            (firstErr.code ? firstErr.code + ": " : "") +
            firstErr.message +
            "). Vui lòng kiểm tra đã chạy file supabase-setup.sql chưa.";
        }

        const rawProfiles = Array.isArray(profilesRes.data) ? profilesRes.data : [];
        const rawSubRows = Array.isArray(subsRes.data) ? subsRes.data : [];
        const reviewRows = Array.isArray(reviewsRes.data) ? reviewsRes.data : [];

        const reviewBySubId = {};
        reviewRows.forEach(r => {
          if (r && r.submission_id) reviewBySubId[r.submission_id] = r;
        });

        const profileById = {};
        rawProfiles.forEach(p => {
          if (p && p.id) profileById[p.id] = p;
        });

        const nowMs = Date.now();
        const submittedRows = rawSubRows.filter(row => row && row.is_submitted);
        const userHasSubs = new Set(submittedRows.map(r => r.user_id));

        // Ẩn tài khoản admin khỏi danh sách học viên nếu không có bài nộp thử
        const hiddenAdminIds = new Set();
        rawProfiles.forEach(p => {
          if (isHiddenAdminAccount(p.email, p.full_name) && !userHasSubs.has(p.id)) {
            hiddenAdminIds.add(p.id);
          }
        });

        const submissions = submittedRows
          .filter(row => !hiddenAdminIds.has(row.user_id))
          .map(row => {
            const prof = profileById[row.user_id] || { id: row.user_id, full_name: "Học viên", email: "" };
            const cleanName = CLOUD.stripClassPrefix(prof.full_name || "") || prof.email || "Học viên";
            const unitObj = unitById[row.lesson_id];
            const lessonShort = unitObj ? `Unit ${unitObj.number} · ${unitObj.titleEn}` : row.lesson_title || row.lesson_id;
            const lessonTitle = unitObj
              ? `Unit ${unitObj.number}: ${unitObj.titleEn} (${unitObj.titleVi})`
              : row.lesson_title || row.lesson_id;
            const ts = row.submitted_at || row.updated_at || row.created_at;
            const rev = reviewBySubId[row.id] || null;
            const hasReadyReview = Boolean(rev && rev.status === "ready" && rev.review_json);
            const relMs = rev && rev.release_at ? new Date(rev.release_at).getTime() : 0;
            const isReviewReleased = hasReadyReview && (relMs <= 0 || relMs <= nowMs);
            const isWaitingRelease = hasReadyReview && relMs > nowMs;
            const isReviewSeen = isReviewReleased && Boolean(rev.student_seen_at);

            return {
              submissionId: row.id,
              studentId: row.user_id,
              studentName: cleanName,
              studentEmail: prof.email || "",
              lessonId: row.lesson_id,
              lessonShort,
              lessonTitle,
              promptText: row.prompt_text || "",
              content: row.content || "",
              wordCount: row.word_count || 0,
              isSubmitted: true,
              submittedAt: CLOUD.formatDateTime(ts),
              rawTime: new Date(ts || 0).getTime(),
              teacherFeedback: row.teacher_feedback || "",
              aiStatus: row.ai_status || "",
              aiReleaseAt: row.ai_release_at || "",
              aiReview: rev,
              hasReadyReview,
              isReviewReleased,
              isWaitingRelease,
              isReviewSeen
            };
          });

        submissions.sort((a, b) => (b.rawTime || 0) - (a.rawTime || 0));

        // Đảm bảo học viên có bài nộp nhưng chưa có profile vẫn hiện trong danh sách
        const studentList = [];
        const addedStudentIds = new Set();
        rawProfiles
          .filter(p => !hiddenAdminIds.has(p.id))
          .forEach(p => {
            addedStudentIds.add(p.id);
            studentList.push({
              id: p.id,
              name: CLOUD.stripClassPrefix(p.full_name || "") || p.email || "Học viên",
              email: p.email || "",
              createdAt: CLOUD.formatDateTime(p.created_at),
              lastActiveAt: CLOUD.formatDateTime(p.last_active_at || p.created_at)
            });
          });
        submissions.forEach(sub => {
          if (!addedStudentIds.has(sub.studentId)) {
            addedStudentIds.add(sub.studentId);
            studentList.push({
              id: sub.studentId,
              name: sub.studentName,
              email: sub.studentEmail,
              createdAt: sub.submittedAt,
              lastActiveAt: sub.submittedAt
            });
          }
        });

        tState.students = studentList;
        tState.submissions = submissions;
        if (tState.selectedStudentId && !tState.students.some(s => s.id === tState.selectedStudentId)) {
          tState.selectedStudentId = "";
        }
        if (tState.infoModalStudentId && !tState.students.some(s => s.id === tState.infoModalStudentId)) {
          tState.infoModalStudentId = "";
        }
        tState.loading = false;
        renderTeacherApp();
      }

      // ======================================================================
      // TEACHER ACTIONS
      // ======================================================================
      async function saveTeacherFeedback(submissionId, feedbackVal) {
        const client = CLOUD.getClient();
        if (!client) return;
        const { error } = await client
          .from("writing_submissions")
          .update({ teacher_feedback: feedbackVal, updated_at: new Date().toISOString() })
          .eq("id", submissionId);

        if (!error) {
          const item = tState.submissions.find(s => s.submissionId === submissionId);
          if (item) item.teacherFeedback = feedbackVal;
          tState.savedToastId = submissionId;
          renderTeacherApp();
          setTimeout(() => {
            if (tState.savedToastId === submissionId) {
              tState.savedToastId = "";
              renderTeacherApp();
            }
          }, 2200);
        } else {
          alert("Lỗi lưu nhận xét: " + error.message);
        }
      }

      async function triggerTeacherCorrection(submissionId) {
        if (!submissionId || tState.gradingSubId) return;
        tState.gradingSubId = submissionId;
        renderTeacherApp();

        const res = await CLOUD.invokeGradeWriting(submissionId, {
          forceTeacher: true,
          releaseNow: false
        });
        tState.gradingSubId = "";
        if (!res.ok) {
          renderTeacherApp();
          alert(
            "Không tạo được bài sửa: " +
              (res.error || "Vui lòng kiểm tra cấu hình Edge Function trên Supabase.")
          );
          return;
        }
        await refreshCloudDashboardData();
      }

      async function releaseReviewNow(submissionId) {
        const client = CLOUD.getClient();
        if (!client || !submissionId || tState.releasingSubId) return;
        tState.releasingSubId = submissionId;
        renderTeacherApp();

        const { error } = await client.rpc("teacher_release_review_now", { p_submission_id: submissionId });
        tState.releasingSubId = "";
        if (error) {
          renderTeacherApp();
          alert("Không trả bài sửa sớm được: " + error.message);
          return;
        }
        await refreshCloudDashboardData();
      }

      async function deleteSubmissionForRetry(submissionId) {
        const client = CLOUD.getClient();
        if (!client || !submissionId || tState.deletingSubId) return;
        const sub = tState.submissions.find(s => s.submissionId === submissionId);
        if (!sub) return;

        if (
          !confirm(
            `Bạn có chắc muốn XOÁ bài viết "${sub.lessonShort}" của học viên "${sub.studentName}" để học viên làm lại?\n\nNội dung bài viết và bài sửa của bài này sẽ bị gỡ bỏ.`
          )
        ) {
          return;
        }

        tState.deletingSubId = submissionId;
        renderTeacherApp();

        try {
          const { error } = await client
            .from("writing_submissions")
            .delete()
            .eq("id", submissionId);

          if (error) {
            tState.deletingSubId = "";
            renderTeacherApp();
            alert("Không xoá được bài nộp: " + error.message);
            return;
          }
          tState.deletingSubId = "";
          await refreshCloudDashboardData();
        } catch (err) {
          tState.deletingSubId = "";
          renderTeacherApp();
          alert("Lỗi khi xoá bài nộp: " + (err && err.message ? err.message : "Không xác định"));
        }
      }

      async function flushPendingQueueNow() {
        if (tState.flushingQueue) return;
        tState.flushingQueue = true;
        renderTeacherApp();
        const res = await CLOUD.invokeProcessQueue(5);
        tState.flushingQueue = false;
        if (!res.ok) {
          renderTeacherApp();
          alert("Không xử lý được danh sách bài chờ: " + (res.error || "Lỗi không xác định"));
          return;
        }
        await refreshCloudDashboardData();
        alert(`Đã xử lý ${res.processed || 0} bài chờ: thành công ${res.succeeded || 0} bài, còn chờ thử lại ${res.failed || 0} bài.`);
      }

      // ======================================================================
      // FILTERING & METRICS
      // ======================================================================
      function hasActiveFilters() {
        return (
          tState.searchQuery.trim() !== "" ||
          tState.filterLesson !== "all" ||
          tState.filterStatus !== "all"
        );
      }

      function getStudentScopedMetrics(studentId) {
        const userSubs = tState.submissions.filter(sub => {
          if (sub.studentId !== studentId) return false;
          if (tState.filterLesson !== "all" && sub.lessonId !== tState.filterLesson) return false;
          return true;
        });

        const releasedCount = userSubs.filter(s => s.isReviewReleased).length;
        const seenCount = userSubs.filter(s => s.isReviewSeen).length;
        const pendingCount = userSubs.filter(s => !s.isReviewReleased).length;
        const unreadCount = userSubs.filter(s => s.isReviewReleased && !s.isReviewSeen).length;

        return {
          submittedCount: userSubs.length,
          releasedCount,
          seenCount,
          pendingCount,
          unreadCount
        };
      }

      function getFilteredStudents() {
        const q = tState.searchQuery.trim().toLowerCase();
        return tState.students
          .map(st => ({
            ...st,
            metrics: getStudentScopedMetrics(st.id)
          }))
          .filter(st => {
            if (q && !`${st.name} ${st.email}`.toLowerCase().includes(q)) return false;
            if (tState.filterLesson !== "all" && st.metrics.submittedCount === 0) return false;
            if (tState.filterStatus === "waiting" && st.metrics.pendingCount === 0) return false;
            if (tState.filterStatus === "unread_review" && st.metrics.unreadCount === 0) return false;
            if (tState.filterStatus === "has_subs" && st.metrics.submittedCount === 0) return false;
            return true;
          })
          .sort((a, b) => {
            if (b.metrics.submittedCount !== a.metrics.submittedCount) {
              return b.metrics.submittedCount - a.metrics.submittedCount;
            }
            return a.name.localeCompare(b.name, "vi");
          });
      }

      function getFilteredSubmissionsForStudent(studentId) {
        return tState.submissions.filter(sub => {
          if (studentId && sub.studentId !== studentId) return false;
          if (tState.filterLesson !== "all" && sub.lessonId !== tState.filterLesson) return false;
          if (tState.filterStatus === "waiting" && sub.isReviewReleased) return false;
          if (tState.filterStatus === "unread_review" && (!sub.isReviewReleased || sub.isReviewSeen)) return false;
          if (tState.filterStatus === "released" && !sub.isReviewReleased) return false;
          if (tState.filterStatus === "no_feedback" && sub.teacherFeedback.trim()) return false;
          return true;
        });
      }

      // ======================================================================
      // EXPORT CSV (EXCEL-READY WITH UTF-8 BOM)
      // ======================================================================
      function exportCsvReport(rows) {
        const csvCell = v => `"${String(v || "").replace(/"/g, '""')}"`;
        const header = [
          "Học viên",
          "Email",
          "Bài học Writing",
          "Số từ",
          "Trạng thái bài sửa",
          "Thời gian nộp",
          "Nội dung bài viết",
          "Số lỗi cần sửa",
          "Nhận xét giáo viên"
        ];
        const lines = [header.map(csvCell).join(",")];
        rows.forEach(sub => {
          const errCount =
            sub.hasReadyReview && Array.isArray(sub.aiReview.review_json.corrections)
              ? sub.aiReview.review_json.corrections.length
              : "";
          const readLabel = sub.isReviewReleased
            ? sub.isReviewSeen
              ? "Đã đọc bài sửa"
              : "Chưa đọc bài sửa"
            : sub.isWaitingRelease
              ? "Đã sửa · chờ trả (15 phút)"
              : "Đang chờ xử lý";
          lines.push(
            [
              sub.studentName,
              sub.studentEmail,
              sub.lessonTitle,
              sub.wordCount || 0,
              readLabel,
              sub.submittedAt,
              sub.content,
              errCount,
              sub.teacherFeedback
            ]
              .map(csvCell)
              .join(",")
          );
        });
        const blob = new Blob(["\uFEFF" + lines.join("\n")], { type: "text/csv;charset=utf-8;" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = `bao-cao-ielts-writing-${new Date().toISOString().slice(0, 10)}.csv`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
      }

      // RENDERING VIEWS
      // ======================================================================

        return `
          <div class="auth-wrapper">
            <div class="auth-card-box">
              <div style="margin-bottom:10px;">
                <span class="auth-badge-tag" style="background:#DCFCE7;color:#166534;">TRANG GIÁO VIÊN · QUẢN LÝ WRITING</span>
              </div>
              <h1 style="font-size:22px;font-weight:900;color:#18181B;margin-bottom:6px;">

              </h1>

              </p>

              ${tState.authError ? `<div class="auth-msg-err">⚠️ ${escapeHtml(tState.authError)}</div>` : ""}

              <button type="button" class="google-auth-btn" id="btn-teacher-google-login" ${tState.loading ? "disabled" : ""}>
                ${CLOUD.renderGoogleIconSvg(19)}

              <div class="auth-or-divider"><span>Hoặc đăng nhập Email Giáo viên</span></div>

              <form id="teacher-cloud-email-form" onsubmit="return false;">
                <div class="form-field">
                  <label class="form-label" for="inp-teacher-email">Email Giáo viên</label>

                  <label class="form-label" for="inp-teacher-pass">Mật khẩu</label>
                  <input type="password" id="inp-teacher-pass" class="form-input" placeholder="Nhập mật khẩu..." required />
                </div>
                <button type="submit" class="form-submit-btn" ${tState.loading ? "disabled" : ""}>

                </button>

              <a href="./index.html" style="display:block;text-align:center;margin-top:12px;font-size:12.5px;font-weight:600;color:#71717A;text-decoration:none;">

      function renderReadReviewBadge(metrics) {
        if (!metrics || (metrics.releasedCount === 0 && metrics.pendingCount === 0)) {
          return `<span class="review-read-pill neutral">Chưa có bài sửa</span>`;
        }
        if (metrics.releasedCount === 0 && metrics.pendingCount > 0) {
          return `<span class="review-read-pill waiting">⏳ Chờ trả (${metrics.pendingCount})</span>`;
        }
        if (metrics.seenCount === metrics.releasedCount) {
          return `<span class="review-read-pill read">✓ Đã đọc (${metrics.seenCount}/${metrics.releasedCount})</span>`;
        }
        if (metrics.seenCount === 0) {
          return `<span class="review-read-pill unread">● Chưa đọc (0/${metrics.releasedCount})</span>`;
        }
        return `<span class="review-read-pill partial">Đã đọc ${metrics.seenCount}/${metrics.releasedCount}</span>`;
      }

      function renderAccountMenuHtml() {
        const displayName = getTeacherDisplayName(tState.teacherEmail);
        const initials = getInitials(displayName);

        return `
          <div class="account-menu-wrap" id="teacher-account-menu-wrap">
            <button
              type="button"
              class="user-account-pill"
              id="btn-toggle-account-menu"
              aria-expanded="${tState.accountMenuOpen ? "true" : "false"}"
              title="Tài khoản quản trị"
            >
              <span class="user-initials">${escapeHtml(initials)}</span>
              <span>${escapeHtml(displayName)}</span>
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="6 9 12 15 18 9"/></svg>
            </button>

            ${
              tState.accountMenuOpen
                ? `
                <div class="account-dropdown" id="teacher-account-dropdown">
                  <div class="account-dropdown-meta">
                    <div class="account-dropdown-role">${escapeHtml(displayName)}</div>
                    <div class="account-dropdown-email">${escapeHtml(tState.teacherEmail || "")}</div>

                  <button type="button" class="account-logout-item" id="btn-teacher-logout">

                    const scheduledReleaseMs = sub.aiReleaseAt
                      ? new Date(sub.aiReleaseAt).getTime()
                      : sub.rawTime

                    } else if (isOverdue) {
                      statusHtml = `<span style="font-size:12.5px;font-weight:700;color:#B91C1C;">⚠️ Đã quá hạn ${RELEASE_MINUTES} phút chưa có bài sửa — bấm “Tạo bài sửa” để xử lý ngay.</span>`;
                    } else if (sub.aiStatus === "pending" || sub.aiStatus === "pending_retry" || sub.aiStatus === "grading") {
                      statusHtml = `<span style="font-size:12.5px;font-weight:700;color:#92400E;">⏳ Đang chờ xử lý bài sửa (trả sau ${RELEASE_MINUTES} phút).</span>`;

                    return `

                              ${escapeHtml(sub.lessonTitle)}
                            </span>
                            <span style="font-family:var(--font-mono);font-size:11.5px;font-weight:700;color:#27272A;background:#F4F4F5;padding:3px 8px;border-radius:5px;">
                              ${sub.wordCount} từ
                            </span>
                          </div>
                          <div>
                            <span class="submitted-badge">✓ Đã nộp (${escapeHtml(sub.submittedAt || "")})</span>
                          </div>
                        </div>

                        ${
                          sub.promptText
                            ? `<div class="teacher-prompt-snippet"><strong>Đề bài:</strong> ${escapeHtml(sub.promptText)}</div>`
                            : ""
                        }

                        <div class="teacher-writing-body">${escapeHtml(sub.content || "(Bài viết trống)")}</div>

                        <div class="teacher-ai-bar">
                          <div>${statusHtml}</div>
                          <div class="teacher-ai-actions">
                            ${
                              sub.isWaitingRelease
                                ? `<button type="button" class="top-pill-btn yellow" data-release-now="${escapeHtml(sub.submissionId)}" ${isReleasing ? "disabled" : ""}>
                                    ${isReleasing ? "Đang trả..." : "⚡ Trả bài sửa ngay"}
                                  </button>`
                                : ""
                            }
                            <button type="button" class="top-pill-btn" data-ai-grade="${escapeHtml(sub.submissionId)}" ${isGrading ? "disabled" : ""}>
                              ${isGrading ? "⏳ Đang tạo bài sửa..." : sub.hasReadyReview ? "↻ Tạo lại bài sửa" : "✨ Tạo bài sửa"}
                            </button>
                            <button
                              type="button"
                              class="top-pill-btn"
                              style="color:#B91C1C;border-color:#FCA5A5;background:#FEF2F2;"
                              data-delete-submission="${escapeHtml(sub.submissionId)}"
                              ${isDeleting ? "disabled" : ""}
                              title="Xoá bài viết này để học viên làm lại"
                            >
                              ${isDeleting ? "Đang xoá..." : "🗑️ Xoá bài"}
                            </button>
                          </div>
                        </div>

                        ${
                          sub.hasReadyReview
                            ? `
                              <details class="teacher-ai-details">
                                <summary>📝 Xem bài sửa chi tiết (${errCount} lỗi cần chú ý)</summary>
                                ${CLOUD.renderWritingReviewHtml(sub.content || "", rev.review_json)}
                              </details>
                            `
                            : ""
                        }

                        <div class="grade-row">
                          <input
                            type="text"
                            class="form-input grade-fb-input"
                            placeholder="Nhận xét thêm của Giáo viên (học viên sẽ thấy ngay dưới bài viết và trong chuông thông báo)..."

                            id="inp-fb-${escapeHtml(sub.submissionId)}"

                          <button type="button" class="save-grade-btn" data-save-grade="${escapeHtml(sub.submissionId)}">
                            ${tState.savedToastId === sub.submissionId ? "✓ Đã lưu!" : "Lưu nhận xét"}
                          </button>
                        </div>
                      </div>
                    `;
                  })
                  .join("")
          }
        `;
      }

      function renderTeacherApp() {
        const root = document.getElementById("teacher-app");
        if (!root) return;
        if (tState.unauthorizedEmail) root.innerHTML = renderUnauthorizedView();
        else if (tState.authenticated) root.innerHTML = renderTeacherDashboard();
        else root.innerHTML = renderTeacherLogin();
        bindTeacherEvents();
      }

      function bindTeacherEvents() {
        const btnGoogle = document.getElementById("btn-teacher-google-login");
        if (btnGoogle) {
          btnGoogle.onclick = async () => {
            tState.loading = true;
            tState.authError = "";
            renderTeacherApp();
            const { error } = await CLOUD.signInWithGoogle();
            if (error) {
              tState.loading = false;
              tState.authError = "Lỗi đăng nhập Google: " + error.message;
              renderTeacherApp();
            }
          };
        }

        const cloudEmailForm = document.getElementById("teacher-cloud-email-form");
        if (cloudEmailForm) {
          cloudEmailForm.onsubmit = async e => {
            e.preventDefault();
            const client = CLOUD.getClient();
            if (!client) {
              tState.authError = "Chưa cấu hình kết nối Supabase.";
              renderTeacherApp();
              return;
            }
            const email = (document.getElementById("inp-teacher-email").value || "").trim().toLowerCase();
            const password = (document.getElementById("inp-teacher-pass").value || "").trim();
            tState.loading = true;
            tState.authError = "";
            renderTeacherApp();
            const { data, error } = await client.auth.signInWithPassword({ email, password });
            if (error || !data || !data.user) {
              tState.loading = false;
              tState.authError = "Email hoặc mật khẩu chưa đúng.";
              renderTeacherApp();
              return;
            }
            await verifyAndLoadCloudTeacher(data.user);
          };
        }

        const btnToggleAcc = document.getElementById("btn-toggle-account-menu");
        if (btnToggleAcc) {
          btnToggleAcc.onclick = e => {
            e.stopPropagation();
            tState.accountMenuOpen = !tState.accountMenuOpen;
            renderTeacherApp();
          };
        }

        const btnLogout = document.getElementById("btn-teacher-logout");
        if (btnLogout) {
          btnLogout.onclick = async () => {
            tState.accountMenuOpen = false;
            const client = CLOUD.getClient();
            if (client) {
              try { await client.auth.signOut(); } catch (e) {}
            }
            tState.authenticated = false;
            tState.unauthorizedEmail = "";
            tState.teacherEmail = "";
            tState.teacherUserId = "";
            renderTeacherApp();
          };
        }

        const btnBrandReset = document.getElementById("btn-brand-reset-view");
        if (btnBrandReset) {
          btnBrandReset.onclick = () => {
            tState.selectedStudentId = "";
            tState.filterStatus = "all";
            renderTeacherApp();
          };
        }

        const btnBackStudents = document.getElementById("btn-back-to-students");
        if (btnBackStudents) {
          btnBackStudents.onclick = () => {
            tState.selectedStudentId = "";
            tState.filterStatus = "all";
            renderTeacherApp();
          };
        }

        const btnRefresh = document.getElementById("btn-refresh-data");
        if (btnRefresh) btnRefresh.onclick = () => refreshCloudDashboardData();

        const btnFlush = document.getElementById("btn-flush-queue");
        if (btnFlush) btnFlush.onclick = () => flushPendingQueueNow();

        const btnExportCsv = document.getElementById("btn-export-csv");
        if (btnExportCsv) {
          btnExportCsv.onclick = () =>
            exportCsvReport(getFilteredSubmissionsForStudent(tState.selectedStudentId || ""));
        }

        const btnResetFilters = document.getElementById("btn-reset-filters");
        if (btnResetFilters) {
          btnResetFilters.onclick = () => {
            tState.searchQuery = "";
            tState.filterLesson = "all";
            tState.filterStatus = "all";
            renderTeacherApp();
          };
        }

        document.querySelectorAll("[data-open-student-info]").forEach(btn => {
          btn.onclick = e => {
            e.stopPropagation();
            tState.infoModalStudentId = btn.getAttribute("data-open-student-info") || "";
            renderTeacherApp();
          };
        });

        ["student-info-backdrop", "btn-close-student-info"].forEach(id => {
          const el = document.getElementById(id);
          if (el) {
            el.onclick = () => {
              tState.infoModalStudentId = "";
              renderTeacherApp();
            };
          }
        });

        document.querySelectorAll("[data-view-student-subs]").forEach(btn => {
          btn.onclick = () => {
            tState.selectedStudentId = btn.getAttribute("data-view-student-subs") || "";
            tState.filterStatus = "all";
            renderTeacherApp();
            window.scrollTo({ top: 0, behavior: "smooth" });
          };
        });

        const inpSearch = document.getElementById("inp-filter-search");
        if (inpSearch) {
          inpSearch.oninput = e => {
            tState.searchQuery = e.target.value;
            const pos = e.target.selectionStart;
            renderTeacherApp();
            const nextEl = document.getElementById("inp-filter-search");
            if (nextEl) {
              nextEl.focus();
              nextEl.setSelectionRange(pos, pos);
            }
          };
        }

        const selLesson = document.getElementById("sel-filter-lesson");
        if (selLesson) {
          selLesson.onchange = e => {
            tState.filterLesson = e.target.value;
            renderTeacherApp();
          };
        }

        const selStatus = document.getElementById("sel-filter-status");
        if (selStatus) {
          selStatus.onchange = e => {
            tState.filterStatus = e.target.value;
            renderTeacherApp();
          };
        }

        document.querySelectorAll("[data-save-grade]").forEach(btn => {
          btn.onclick = async () => {
            const subId = btn.getAttribute("data-save-grade");
            const fbInp = document.getElementById("inp-fb-" + subId);
            await saveTeacherFeedback(subId, fbInp ? fbInp.value.trim() : "");
          };
        });

        document.querySelectorAll("[data-ai-grade]").forEach(btn => {
          btn.onclick = () => triggerTeacherCorrection(btn.getAttribute("data-ai-grade"));
        });

        document.querySelectorAll("[data-release-now]").forEach(btn => {
          btn.onclick = () => releaseReviewNow(btn.getAttribute("data-release-now"));
        });

        document.querySelectorAll("[data-delete-submission]").forEach(btn => {
          btn.onclick = () => deleteSubmissionForRetry(btn.getAttribute("data-delete-submission"));
        });
      }

      document.addEventListener("click", e => {
        if (tState.accountMenuOpen && !e.target.closest("#teacher-account-menu-wrap")) {
          tState.accountMenuOpen = false;
          renderTeacherApp();
        }
      });

      document.addEventListener("keydown", e => {
        if (e.key === "Escape" && (tState.accountMenuOpen || tState.infoModalStudentId)) {
          tState.accountMenuOpen = false;
          tState.infoModalStudentId = "";
          renderTeacherApp();
        }
      });

      window.addEventListener("DOMContentLoaded", async () => {
        const client = CLOUD ? CLOUD.getClient() : null;
        if (!client) {
          tState.authError = "Chưa cấu hình kết nối Supabase.";
          renderTeacherApp();
          return;
        }
        renderTeacherApp();
        const { data } = await client.auth.getSession();
        if (data && data.session && data.session.user) {
          await verifyAndLoadCloudTeacher(data.session.user);
        }
        client.auth.onAuthStateChange(async (event, session) => {
          if (event === "SIGNED_IN" && session && session.user && !tState.authenticated && !tState.unauthorizedEmail) {
            await verifyAndLoadCloudTeacher(session.user);
          } else if (event === "SIGNED_OUT") {
            tState.authenticated = false;
            tState.unauthorizedEmail = "";
            tState.teacherEmail = "";
            tState.teacherUserId = "";
            renderTeacherApp();
          }
        });
      });
    })();
  </script>
</body>
</html>
